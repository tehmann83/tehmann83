<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 44" width="1200" height="44" shape-rendering="crispEdges" role="presentation" aria-hidden="true">
<style>
  .tw1{animation:tw1 3.2s steps(1,end) infinite}
  .tw2{animation:tw2 4.6s steps(1,end) 1.1s infinite}
  .tw3{animation:tw3 5.3s steps(1,end) .6s infinite}
  .car{animation:car 9s linear infinite}
  .car2{animation:car2 13s linear 3.5s infinite}
  .pulse{animation:pulse 4s ease-in-out infinite}
  @keyframes tw1{0%,100%{opacity:.22}46%{opacity:1}54%{opacity:.22}}
  @keyframes tw2{0%,100%{opacity:.18}38%{opacity:.9}48%{opacity:.18}}
  @keyframes tw3{0%,100%{opacity:.18}60%{opacity:.8}68%{opacity:.18}}
  @keyframes car{0%{transform:translateX(-170px);opacity:0}8%{opacity:1}76%{opacity:1}84%,100%{transform:translateX(1370px);opacity:0}}
  @keyframes car2{0%{transform:translateX(1320px);opacity:0}7%{opacity:.8}62%{opacity:.8}70%,100%{transform:translateX(-1450px);opacity:0}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
  @media (prefers-reduced-motion:reduce){.tw1,.tw2,.tw3,.car,.car2,.pulse{animation:none!important;opacity:1}}
</style>
<clipPath id="c"><rect width="1200" height="44" rx="6"/></clipPath>
<g clip-path="url(#c)">
  <!-- night sky -->
  <rect width="1200" height="44" fill="#080B1D"/>
  <rect y="30" width="1200" height="14" fill="#090F22"/>

  <!-- distant neon horizon -->
  <rect y="28" width="1200" height="1" fill="#1ED8F2" opacity=".22"/>
  <rect y="29" width="1200" height="1" fill="#9D4EDD" opacity=".18"/>

  <!-- cyberpunk skyline -->
  <g fill="#111735">
    <rect x="0" y="18" width="42" height="18"/><rect x="46" y="12" width="30" height="24"/>
    <rect x="80" y="20" width="54" height="16"/><rect x="139" y="8" width="23" height="28"/>
    <rect x="167" y="16" width="38" height="20"/><rect x="211" y="10" width="33" height="26"/>
    <rect x="249" y="22" width="56" height="14"/><rect x="310" y="14" width="24" height="22"/>
    <rect x="339" y="18" width="42" height="18"/><rect x="386" y="7" width="29" height="29"/>
    <rect x="420" y="20" width="47" height="16"/><rect x="472" y="11" width="34" height="25"/>
    <rect x="511" y="17" width="26" height="19"/><rect x="542" y="5" width="22" height="31"/>
    <rect x="569" y="20" width="58" height="16"/><rect x="632" y="13" width="31" height="23"/>
    <rect x="668" y="18" width="41" height="18"/><rect x="714" y="9" width="25" height="27"/>
    <rect x="744" y="21" width="53" height="15"/><rect x="802" y="12" width="32" height="24"/>
    <rect x="839" y="16" width="38" height="20"/><rect x="882" y="6" width="27" height="30"/>
    <rect x="914" y="19" width="46" height="17"/><rect x="965" y="10" width="34" height="26"/>
    <rect x="1004" y="21" width="49" height="15"/><rect x="1058" y="14" width="26" height="22"/>
    <rect x="1089" y="18" width="43" height="18"/><rect x="1137" y="8" width="28" height="28"/>
    <rect x="1170" y="20" width="30" height="16"/>
  </g>

  <!-- antennas -->
  <g fill="#263369">
    <rect x="150" y="4" width="2" height="7"/><rect x="397" y="2" width="2" height="7"/>
    <rect x="552" y="0" width="2" height="6"/><rect x="725" y="3" width="2" height="6"/>
    <rect x="895" y="1" width="2" height="6"/><rect x="1150" y="3" width="2" height="6"/>
  </g>

  <!-- windows -->
  <g fill="#27E5F6">
    <rect class="tw1" x="54" y="18" width="3" height="3"/><rect x="95" y="25" width="3" height="3"/>
    <rect class="tw2" x="146" y="15" width="3" height="3"/><rect x="228" y="17" width="3" height="3"/>
    <rect class="tw3" x="320" y="21" width="3" height="3"/><rect x="397" y="13" width="3" height="3"/>
    <rect x="480" y="17" width="3" height="3"/><rect class="tw1" x="550" y="11" width="3" height="3"/>
    <rect x="646" y="18" width="3" height="3"/><rect class="tw2" x="721" y="15" width="3" height="3"/>
    <rect x="817" y="18" width="3" height="3"/><rect class="tw3" x="892" y="12" width="3" height="3"/>
    <rect x="980" y="16" width="3" height="3"/><rect class="tw1" x="1070" y="20" width="3" height="3"/>
    <rect x="1147" y="14" width="3" height="3"/>
  </g>
  <g fill="#FF4D9D">
    <rect x="69" y="24" width="3" height="3"/><rect class="tw2" x="184" y="21" width="3" height="3"/>
    <rect x="363" y="24" width="3" height="3"/><rect class="tw3" x="504" y="24" width="3" height="3"/>
    <rect x="681" y="23" width="3" height="3"/><rect class="tw1" x="857" y="21" width="3" height="3"/>
    <rect x="1028" y="25" width="3" height="3"/>
  </g>
  <g fill="#FFC857">
    <rect class="tw3" x="119" y="22" width="3" height="3"/><rect x="276" y="26" width="3" height="3"/>
    <rect class="tw1" x="443" y="22" width="3" height="3"/><rect x="606" y="25" width="3" height="3"/>
    <rect class="tw2" x="773" y="24" width="3" height="3"/><rect x="938" y="22" width="3" height="3"/>
    <rect class="tw3" x="1111" y="24" width="3" height="3"/>
  </g>

  <!-- moving light trails -->
  <g class="car">
    <rect x="-150" y="27" width="125" height="1" fill="#20D9F5" opacity=".35"/>
    <rect x="-25" y="25" width="16" height="3" fill="#65F6FF"/>
  </g>
  <g class="car2">
    <rect x="1210" y="31" width="90" height="1" fill="#FF4D9D" opacity=".32"/>
    <rect x="1198" y="29" width="12" height="3" fill="#FF6CB1"/>
  </g>

  <!-- water / street reflections -->
  <g opacity=".9">
    <rect x="0" y="37" width="1200" height="1" fill="#1ED8F2" opacity=".16"/>
    <rect class="pulse" x="75" y="39" width="46" height="2" fill="#20D9F5"/>
    <rect x="174" y="41" width="31" height="1" fill="#FF4D9D" opacity=".7"/>
    <rect class="pulse" x="286" y="38" width="67" height="1" fill="#FF4D9D"/>
    <rect x="426" y="40" width="52" height="2" fill="#FFC857" opacity=".6"/>
    <rect class="pulse" x="551" y="39" width="82" height="1" fill="#20D9F5"/>
    <rect x="708" y="41" width="48" height="1" fill="#FF4D9D" opacity=".7"/>
    <rect class="pulse" x="824" y="38" width="76" height="2" fill="#20D9F5"/>
    <rect x="982" y="40" width="42" height="1" fill="#FFC857" opacity=".65"/>
    <rect class="pulse" x="1089" y="39" width="55" height="1" fill="#FF4D9D"/>
  </g>
</g>
</svg>